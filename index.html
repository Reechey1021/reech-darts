<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reech Darts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h1>Reech's No-Moneygrab Darts Counter🎯</h1>
  <p class="titleparagraph"> Because 2000 lines of code should not cost £5.99 a month</p>

  <div class="card">
    <div class="toprow">
        <div id="gameMeta" class="gameMeta"></div>
        <button id="newGameBtn">New Game</button>
      </div>      

    <p id="status">Connecting…</p>

    <div class="scores">
      <div class="player" id="p1Box">
        <div class="legsBadge" id="p1Legs">0</div>
        <input id="p1Name" class="name" value="Player 1" />
        <div class="score" id="p1Score">—</div>
        <div class="checkout" id="p1Checkout"></div>
        <div class="stats" id="p1Stats"></div>
      </div>

      <div class="player" id="p2Box">
        <div class="legsBadge" id="p2Legs">0</div>
        <input id="p2Name" class="name" value="Player 2" />
        <div class="score" id="p2Score">—</div>
        <div class="checkout" id="p2Checkout"></div>
        <div class="stats" id="p2Stats"></div>
      </div>
    </div>

    <div class="row">
        <button id="undoBtn">Undo</button>
        <input
          id="scoreInput"
          type="text"
          inputmode="numeric"
          placeholder="Score"
          autocomplete="off"
        />
        <button id="submitBtn">Submit</button>
      </div>

      <p id="error" class="error hidden"></p>
      
      <div class="keypad" id="keypad">
        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
      
        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
      
        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
      
        <button class="key key-wide" id="keyClear">Clear</button>
        <button class="key" data-digit="0">0</button>
        <button class="key key-wide" id="keyBack">⌫</button>
      </div>
      

  </div>

  <div id="winnerModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="winnerText">Winner</h2>
      <div id="matchStatsGrid" class="matchStats"></div>
      <button id="winnerNewGameBtn">New Game</button>
    </div>
  </div>
  
  <div id="setupModal" class="modal hidden">
    <div class="modal-card">
      <h2>New Match</h2>
  
      <div class="formRow">
        <label>Player 1</label>
        <input id="setupP1" type="text" value="Player 1" />
      </div>
  
      <div class="formRow">
        <label>Player 2</label>
        <input id="setupP2" type="text" value="Player 2" />
      </div>
  
      <div class="formRow">
        <label>Starting Score</label>
        <select id="setupMode">
          <option value="301">301</option>
          <option value="501" selected>501</option>
        </select>
      </div>
  
      <div class="formRow">
        <label>Best of legs</label>
        <select id="setupBestOf">
          <option value="1">1</option>
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="7">7</option>
          <option value="9">9</option>
        </select>
      </div>
  
      <div class="row">
        <button id="setupCancelBtn">Cancel</button>
        <button id="setupStartBtn">Start Match</button>
      </div>
    </div>
  </div>
  
  <div id="checkoutModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="checkoutTitle">Confirm Checkout</h2>
      <p id="checkoutBody">How many darts did you use?</p>
  
      <div class="row">
        <button class="dartsBtn" data-darts="1">1 dart</button>
        <button class="dartsBtn" data-darts="2">2 darts</button>
        <button class="dartsBtn" data-darts="3">3 darts</button>
      </div>
  
      <div class="row">
        <button id="checkoutCancelBtn">Cancel</button>
        <button id="checkoutConfirmBtn" disabled>Confirm</button>
      </div>
    </div>
  </div>
  
  <div id="confirmNewMatchModal" class="modal hidden">
    <div class="modal-card">
      <h2>Start a new match?</h2>
      <p>This will end the current match.</p>
  
      <div class="row" style="justify-content:center;">
        <button id="confirmNewMatchCancelBtn">Cancel</button>
        <button id="confirmNewMatchOkBtn">Start New Match</button>
      </div>
    </div>
  </div>
  

  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script type="module" src="script.js"></script>

</body>
</html>
