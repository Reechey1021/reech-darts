<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reech Darts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h1>Reech's No-Moneygrab Darts Counter🎯</h1>
  <p class="titleparagraph"> Because 2000 lines of code should not cost £5.99 a month</p>

  <div class="card">
    <div class="toprow">
        <div id="gameMeta" class="gameMeta"></div>
        <div id="masterbuttons" class="masterbuttons">
          <button id="newGameBtn">New Game</button>
          <button id="inviteBtn">Create Lobby</button>
          <!-- Mobile-only settings menu -->
<div class="mobileMenuWrap">
  <details id="mobileMenu" class="mobileMenu">
    <summary id="mobileMenuBtn" aria-label="Menu">⚙️</summary>
    <div class="mobileMenuPanel">
      <button type="button" id="mobileNewGameBtn" class="menuItem">New Game</button>
      <button type="button" id="mobileInviteBtn" class="menuItem">Create Lobby</button>
    </div>
  </details>
</div>

        </div>

<div id="inviteModal" class="modal hidden">
  <div class="modal-card">
    <h2>Invite link</h2>
    <p id="inviteLinkText" style="word-break: break-all;"></p>
    <div class="row">
      <button id="copyInviteBtn">Copy</button>
      <button id="closeInviteBtn">Close</button>
    </div>
  </div>
</div>

        <button id="themeToggleBtn" type="button">🌙</button>
      </div>      

    <p id="status">Connecting…</p>

    <div class="scores">
      <div class="player" id="p1Box">
        <div class="legsBadge" id="p1Legs">0</div>
        <input id="p1Name" class="name" value="Player 1" />
        <div class="score" id="p1Score">—</div>
        <div class="checkout" id="p1Checkout"></div>
        <div class="stats" id="p1Stats"></div>
      </div>

      <div class="player" id="p2Box">
        <div class="legsBadge" id="p2Legs">0</div>
        <input id="p2Name" class="name" value="Player 2" />
        <div class="score" id="p2Score">—</div>
        <div class="checkout" id="p2Checkout"></div>
        <div class="stats" id="p2Stats"></div>
      </div>
    </div>

    <div id="inputArea" class="inputArea">
  <div id="turnOverlay" class="turnOverlay hidden">
    <div id="turnOverlayText"></div>
    <button id="overlayUndoBtn" class="overlayUndoBtn">Undo last score</button>
  </div>
    
    <div class="actionGrid">
  <div class="actionCell">
    <button id="inputModeBtn" class="iconBtn" title="Switch input mode">🎯</button>
    <button id="undoBtn" class="actionBtn">Undo</button>
  </div>

  <div class="actionCell">
    <input
      id="scoreInput"
      type="text"
      inputmode="numeric"
      placeholder=""
      autocomplete="off"
    />
  </div>

  <div class="actionCell">
    <button id="submitBtn" class="actionBtn">Submit</button>
  </div>
</div>

      <p id="error" class="error hidden"></p>
      
      <div class="keypad" id="keypad">
        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
      
        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
      
        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
      
        <button class="key key-wide" id="keyClear">Clear</button>
        <button class="key" data-digit="0">0</button>
        <button class="key key-wide" id="keyBack">⌫</button>
      </div>

<div id="dartTableArea" class="hidden">
  <div class="dartBar">
    <div id="dartBreakdown" class="dartBreakdown">—</div>
    <div class="dartTotal">Total: <span id="dartTotalVal">0</span></div>
  </div>

  <div id="dartPad" class="dartPad">
    <!-- Top row -->
    <button class="dartMultBtn selected" data-mult="S">Single</button>
    <button class="dartMultBtn" data-mult="D">Double</button>
    <button class="dartMultBtn" data-mult="T">Treble</button>
    <button class="dartInstantBtn" data-instant="50">Bull</button>
    <button class="dartInstantBtn" data-instant="25">Outer</button>

    <!-- Numbers 1–20 (5 columns x 4 rows) -->
    <button class="dartNumBtn" data-num="1">1</button>
    <button class="dartNumBtn" data-num="2">2</button>
    <button class="dartNumBtn" data-num="3">3</button>
    <button class="dartNumBtn" data-num="4">4</button>
    <button class="dartNumBtn" data-num="5">5</button>

    <button class="dartNumBtn" data-num="6">6</button>
    <button class="dartNumBtn" data-num="7">7</button>
    <button class="dartNumBtn" data-num="8">8</button>
    <button class="dartNumBtn" data-num="9">9</button>
    <button class="dartNumBtn" data-num="10">10</button>

    <button class="dartNumBtn" data-num="11">11</button>
    <button class="dartNumBtn" data-num="12">12</button>
    <button class="dartNumBtn" data-num="13">13</button>
    <button class="dartNumBtn" data-num="14">14</button>
    <button class="dartNumBtn" data-num="15">15</button>

    <button class="dartNumBtn" data-num="16">16</button>
    <button class="dartNumBtn" data-num="17">17</button>
    <button class="dartNumBtn" data-num="18">18</button>
    <button class="dartNumBtn" data-num="19">19</button>
    <button class="dartNumBtn" data-num="20">20</button>

    <!-- Final row -->
    <button class="dartSpecialBtn" data-action="back">⌫ Back</button>
    <button class="dartSpecialBtn" data-action="miss">MISS</button>
  </div>
</div>

    
  </div>

  <div id="winnerModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="winnerText">Winner</h2>
      <div id="matchStatsGrid" class="matchStats"></div>
      <button id="winnerNewGameBtn">New Game</button>
    </div>
  </div>
  
  <div id="setupModal" class="modal hidden">
    <div class="modal-card">
      <h2>New Match</h2>

      <div class="formRow">
        <label for="setupGameType">Game type</label>
        <select id="setupGameType">
          <option value="single">Local</option>
          <option value="online">Online</option>
        </select>
      </div>

  
      <div class="formRow">
        <label>Player 1 Name</label>
        <input id="setupP1" type="text" value="Player 1" />
      </div>
  
      <div class="formRow">
        <label>Player 2 Name</label>
        <input id="setupP2" type="text" value="Player 2" />
      </div>
  
      <div class="formRow">
        <label>Starting Score</label>
        <select id="setupMode">
          <option value="121">121</option>
          <option value="301">301</option>
          <option value="501" selected>501</option>
          <option value="701">701</option>
        </select>
      </div>
  
      <div class="formRow">
        <label>Best of Legs</label>
        <select id="setupBestOf">
          <option value="1">1</option>
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="7">7</option>
          <option value="9">9</option>
        </select>
      </div>

      <div class="formRow">
        <label for="setupStarter">Starting Player</label>
        <select id="setupStarter">
          <option value="bull">Bull Throw</option>
          <option value="random" selected>Random</option>
          <option value="p1">Player 1</option>
          <option value="p2">Player 2</option>
        </select>
      </div>

  
      <div class="row">
        <button id="setupCancelBtn">Cancel</button>
        <button id="setupStartBtn">Start Match</button>
      </div>
    </div>
  </div>
  
  <div id="checkoutModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="checkoutTitle">Confirm Checkout</h2>
      <p id="checkoutBody">How many darts did you use?</p>
  
      <div class="row">
        <button class="dartsBtn" data-darts="1">1</button>
        <button class="dartsBtn" data-darts="2">2</button>
        <button class="dartsBtn" data-darts="3">3</button>
      </div>
  
      <div class="row">
        <button id="checkoutCancelBtn">Cancel</button>
        <button id="checkoutConfirmBtn" disabled>Confirm</button>
      </div>
    </div>
  </div>
  
  <div id="confirmNewMatchModal" class="modal hidden">
    <div class="modal-card">
      <h2>Start a new match?</h2>
      <p>This will end the current match.</p>
  
      <div class="row" style="justify-content:center;">
        <button id="confirmNewMatchCancelBtn">Cancel</button>
        <button id="confirmNewMatchOkBtn">Start New Match</button>
      </div>
    </div>
  </div>

  <div id="bullModal" class="modal hidden">
  <div class="modal-card">
    <h2>Throw for Bull</h2>
    <p id="bullPrompt" style="margin-top:0; opacity:.85;"></p>
    <p id="bullWaiting" class="hidden" style="margin:6px 0 0; opacity:.85;"></p>

    <div id="bullBoard" class="bullBoard" aria-label="Dartboard"></div>

    <div class="row" style="margin-top:14px;">
      <button id="bullResetBtn" class="actionBtn">Reset</button>
      <button id="bullConfirmBtn" class="actionBtn" disabled>Confirm</button>
    </div>
    <button id="abortBullBtn" class="actionBtn danger">Abort Game</button>
  </div>
</div>

  

  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script type="module" src="script.js"></script>

</body>
</html>
