<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reech Darts • Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Reech Darts</h1>
  <p class="titleparagraph">Dashboard</p>
  <button id="themeToggleBtn" type="button" class="iconBtn" title="Toggle theme">🌙</button>

  <div class="card" style="max-width:720px;">
    <p id="dashWelcome" style="margin-top:0;">Welcome…</p>

	    <!-- Home cards -->
	    <div id="dashHome" style="display:grid; gap:12px;">
      <div class="player" style="padding:14px;">
        <h2 style="margin:0 0 8px;">Play</h2>
        <p style="margin:0 0 12px; opacity:.85;">Create a lobby and share the link.</p>
        <button id="dashPlayBtn" class="actionBtn">Create Lobby</button>
        <p id="dashInvite" style="word-break:break-all; margin:10px 0 0; display:none;"></p>
        <div id="dashInviteRow" class="row" style="justify-content:flex-start; gap:10px; margin-top:10px; display:none;">
          <button id="dashCopyBtn">Copy link</button>
          <button id="dashGoBtn">Open lobby</button>
        </div>
      </div>

	      <div class="player" style="padding:14px;">
	        <h2 style="margin:0 0 8px;">View Statistics</h2>
	        <p style="margin:0 0 12px; opacity:.85;">Your competitive stats + recent results.</p>
	        <button id="dashStatsBtn" class="actionBtn">Open stats</button>
	      </div>

      <div class="player" style="padding:14px;">
        <h2 style="margin:0 0 8px;">Settings</h2>
        <p style="margin:0 0 12px; opacity:.85;">Display name, equipment, sign out.</p>
        <button id="dashSettingsBtn" class="actionBtn">Open settings</button>
        <p id="dashMsg" class="error hidden" style="margin-top:10px;"></p>
      </div>
	    </div>

	    <!-- Stats view (simple, no routing) -->
	    <div id="dashStats" class="hidden" style="display:grid; gap:12px;">
	      <div class="player" style="padding:14px;">
	        <div class="row" style="justify-content:space-between; align-items:center;">
	          <h2 style="margin:0;">Your Statistics</h2>
	          <button id="dashStatsBackBtn" type="button">Back</button>
	        </div>
	        <div id="dashStatsGrid" style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px;"></div>
	        <div style="margin-top:14px;">
	          <div style="opacity:.8; margin-bottom:6px;">Recent results</div>
	          <div id="dashRecent" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
	        </div>
	      </div>
	    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <h2 style="margin-top:0;">Settings</h2>
      <div class="formRow">
        <label for="setDisplayName">Display name</label>
        <input id="setDisplayName" type="text" />
      </div>
      <div class="formRow">
        <label for="setEquipment">Darts / equipment</label>
        <input id="setEquipment" type="text" placeholder="e.g. 24g..." />
      </div>
      <div class="row" style="justify-content:flex-start; gap:10px;">
        <button id="setSaveBtn">Save</button>
        <button id="settingsCloseBtn" type="button">Close</button>
        <button id="setSignOutBtn">Sign out</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
